name: Bug Report
description: Report a defect, calculation inaccuracy, or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve the Urban Air Quality Assistant!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of the problem.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, and browser (e.g. macOS 15, Node 22, Chrome 130).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce the issue?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
