name: Feature Request
description: Propose an air quality calculation, new IAQ hack, or UI improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Suggest an enhancement or new feature for the Urban Air Quality Assistant.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What winter smog or air quality challenge does this address?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the routine adjustment, IAQ hack, or feature to add.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Community & Scientific Impact
      description: Any relevant epidemiological or atmospheric physics references?
